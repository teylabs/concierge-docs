name: CI

# The deploy workflow builds main; this builds every pull request, so the
# tests in scripts/ (llms.txt, llms-full.txt, styling, footer) gate merging.
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
